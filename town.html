function evalEnvForBuilding(b) {
  const T = TY[b.t];
  const z = zones.get(K(b.x, b.y)) || null;
  const zm = z ? ZONE_META[z] : null;
  const zoneMatch = zm ? (zm.matchCat === T.cat) : null;
  let noise = 0;
  if (T.cat === "house") {
    forEachB(other => {
      if (other === b || other.p < 1) return;
      const ot = TY[other.t];
      const dist = Math.hypot(other.x - b.x, other.y - b.y);
      if (dist <= 4.5 && (ot.cat === "work" || zones.get(K(other.x, other.y)) === "ind")) {
        noise += Math.round((5 - dist) * 6);
      }
      if (dist <= 3.5 && (ot.cat === "park" || ot.cat === "edu")) {
        noise = Math.max(0, noise - 5);
      }
    });
  }
  // 計算到河岸碼頭的曼哈頓運輸距離成本
  const distToDock = Math.abs(b.x - DOCK.x) + Math.abs(b.y - DOCK.y);
  const transportCostMult = 1 + Math.max(0, (distToDock - 12) * 0.015);
  return { z, zoneMatch, noise: Math.min(40, noise), distToDock, transportCostMult };
}

function ensureHouseholds() {
  // 清理已不存在的房屋戶籍
  for (const [hk, hh] of households.entries()) {
    const b = bm.get(hk);
    if (!b || TY[b.t].cat !== "house") {
      hh.members.forEach(rid => {
        const r = residents.get(rid);
        if (r) {
          if (r.jobKey && bm.get(r.jobKey)) {
            const jb = bm.get(r.jobKey);
            jb.workers = (jb.workers || []).filter(w => w !== rid);
          }
          residents.delete(rid);
        }
      });
      households.delete(hk);
    }
  }
  // 為已完工且連通道路的民居分配家庭與居民
  forEachB(b => {
    if (TY[b.t].cat !== "house" || b.p < 1) return;
    if (!households.has(b.hk)) {
      const cap = b.t === "h1" ? 2 : b.t === "h2" ? 3 : 4;
      const sn = SURNAMES[Math.floor(Math.random() * SURNAMES.length)];
      const hh = { houseKey: b.hk, members: [], food: 2, goods: 1, savings: 30 };
      const r1 = createResident(b.hk, 22 + Math.floor(Math.random() * 18), "m", sn);
      hh.members.push(r1.id);
      if (cap >= 2) {
        const r2 = createResident(b.hk, 20 + Math.floor(Math.random() * 16), "f", SURNAMES[Math.floor(Math.random() * SURNAMES.length)]);
        r1.spouseId = r2.id; r2.spouseId = r1.id;
        hh.members.push(r2.id);
      }
      if (cap >= 3 && Math.random() < 0.7) {
        const r3 = createResident(b.hk, 4 + Math.floor(Math.random() * 10), Math.random() < 0.5 ? "m" : "f", sn);
        hh.members.push(r3.id);
      }
      if (cap >= 4 && Math.random() < 0.55) {
        const r4 = createResident(b.hk, 55 + Math.floor(Math.random() * 12), Math.random() < 0.5 ? "m" : "f", sn);
        hh.members.push(r4.id);
      }
      households.set(b.hk, hh);

    }
  });
}

function assignWorkers() {
  // 清理無效職務
  for (const r of residents.values()) {
    if (r.jobKey) {
      const jb = bm.get(r.jobKey);
      if (!jb || jb.p < 1 || !ok(jb)) r.jobKey = null;
    }
  }
  forEachB(b => {
    const T = TY[b.t];
    if (b.p < 1 || T.cat === "house" || T.cat === "park") return;
    const maxW = T.jobs || 3;
    b.workers = (b.workers || []).filter(rid => {
      const r = residents.get(rid);
      return r && r.jobKey === b.hk && r.age >= 14;
    });
    if (!ok(b)) return;
    // 補足空缺
    if (b.workers.length < maxW) {
      for (const r of residents.values()) {
        if (b.workers.length >= maxW) break;
        if (!r.jobKey && r.age >= 14 && r.age <= 68) {
          r.jobKey = b.hk;
          b.workers.push(r.id);
          r.log.push("第" + (day + 1) + "日 入職「" + T.n + "」");
        }
      }
    }
  });
}

function assignSingleWorker(rid, targetHk) {
  const r = residents.get(rid);
  if (!r || r.age < 14) return false;
  if (r.jobKey) {
    const oldB = bm.get(r.jobKey);
    if (oldB) oldB.workers = (oldB.workers || []).filter(w => w !== rid);
    r.jobKey = null;
  }
  if (!targetHk) {
    r.log.push("第" + (day + 1) + "日 辭去職務，暫時待業");
    return true;
  }
  const nb = bm.get(targetHk);
  if (!nb || nb.p < 1 || !ok(nb)) return false;
  const maxW = TY[nb.t].jobs || 3;
  nb.workers = nb.workers || [];
  if (nb.workers.length >= maxW) {
    const kickedId = nb.workers.shift();
    const kicked = residents.get(kickedId);
    if (kicked) { kicked.jobKey = null; kicked.log.push("第" + (day + 1) + "日 崗位調整離職"); }
  }
  r.jobKey = targetHk;
  nb.workers.push(rid);
  r.log.push("第" + (day + 1) + "日 調任至「" + TY[nb.t].n + "」");
  return true;
}

function calcConn() {

  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    for (const d of D4) {
      const nx = x + d[0], ny = y + d[1];
      if (hasRoad(nx, ny) && !conn[K(nx, ny)]) { conn[K(nx, ny)] = 1; q.push([nx, ny]); }

      }
      if (b) { $("#resCard").style.display = "none"; showCard(b); }
      else { $("#card").style.display = "none"; $("#resCard").style.display = "none"; say(isW(x, y) ? "河水清澈，可以架大橋到對岸" : hasRoad(x, y) ? (conn[K(x, y)] ? "這條路已經連到河岸了" : "這條路還沒接到河岸") : "一塊空地，先鋪路再在路旁建屋"); }
    }
    return;
  }
  if (tool === "zone") {
    if (isW(x, y)) return say("河面不可劃定功能區");
    const zObj = curT();
    if (zObj.zt) zones.set(K(x, y), zObj.zt);
    else zones.delete(K(x, y));
    dirty();
    return;
  }
  if (tool === "del") {
    if (b && b.br) { b.br = 0; if (!isW(x, y)) { delRoad(x, y); bridges.delete(K(x, y)); } S.m += 40; calcConn(); say("已拆除小橋，退還 40 文"); dirty(); }
    else if (b) removeB(b);
    else if (hasRoad(x, y)) { const bg = bridges.has(K(x, y)); delRoad(x, y); bridges.delete(K(x, y)); S.m += bg ? 80 : ROAD; calcConn(); dirty(); }
    else if (zones.has(K(x, y))) { zones.delete(K(x, y)); say("已清除該格功能區劃"); dirty(); }
    else say("這裡沒有可以拆的東西");
    return;
  }
  if (tool === "bridge") {
    const T = curT(); if (S.m < T.c) return say("資金不夠（需要 " + T.c + " 文）");
    if (T.id === "b1") {
      if (!isW(x, y)) return say("大橋要蓋在河面上");
      if (hasRoad(x, y)) return say("這裡已經有橋了");
      S.m -= T.c; setRoad(x, y); bridges.add(K(x, y)); calcConn(); say("大橋已架好，把對岸的路接上吧"); dirty();
    } else {
      if (!b || TY[b.t].k !== "pond") return say("小橋要點在池塘上");
      if (b.p < 1) return say("池塘還沒挖好");
      if (b.br) return say("這座池塘已經有小橋了");
      S.m -= T.c; b.br = 1; say("池塘上搭好了曲橋"); dirty();
    }
    return;
  }
  if (isW(x, y)) return say("河面只能架大橋，不能蓋建築");
  if (hasRoad(x, y) || b) return say("這格已經有東西了");
  const T = curT(); if (S.m < T.c) return say("資金不夠（需要 " + T.c + " 文）");
  if (tool === "road") { S.m -= ROAD; setRoad(x, y); calcConn(); dirty(); return; }
  if (T.cat !== "park" && T.k !== "well" && !roadAdj(x, y)) return say(D4.some(d => hasRoad(x + d[0], y + d[1])) ? "旁邊的路還沒接到河岸（河東要先蓋大橋）" : "旁邊沒有路：要先把路接到河岸");
  S.m -= T.c;
  const o = { x, y, t: T.id, c: T.c, p: 0, prog: 0, in: {}, out: {}, cash: T.cat === "house" || T.cat === "park" ? 0 : 120, st: "興建中", workers: [] };
  if (T.rec) { Object.keys(T.rec.in).forEach(g => o.in[g] = 0); Object.keys(T.rec.out).forEach(g => o.out[g] = 0); }
  if (T.sells) T.sells.forEach(g => o.out[g] = 0);
  addB(o);
  addChronicle("營建", "動工興建「" + T.n + "」。", "build_" + o.hk + "_" + day);
}

function can(x, y) {
  if (tool === "zone") return !isW(x, y);
  if (tool === "del") return !!getB(x, y) || hasRoad(x, y) || zones.has(K(x, y));
  if (tool === "bridge") { const T = curT(), b = getB(x, y); if (S.m < T.c) return false; return T.id === "b1" ? isW(x, y) && !hasRoad(x, y) : !!b && TY[b.t].k === "pond" && b.p >= 1 && !b.br; }
  if (isW(x, y) || hasRoad(x, y) || getB(x, y)) return false;
  const T = curT(); if (S.m < T.c) return false;
  return tool === "road" || T.cat === "park" || T.k === "well" || roadAdj(x, y);
}

function guide() {
  if (step === 0) {
    let n = 0; for (let i = 0; i < N * N; i++) if (conn[i]) n++;
    if (n >= 5) { step = 1; guide(); } else say("第 1 步：從河邊木棧道向西拖曳「鋪路」（還差 " + (5 - n) + " 格）", "自動鋪路", () => { for (let i = 0; i < 6; i++) if (S.m >= ROAD && !hasRoad(DOCK.x - i, DOCK.y)) { S.m -= ROAD; setRoad(DOCK.x - i, DOCK.y); } calcConn(); guide(); dirty(); });
  } else if (step === 1) {
    let okH = false; forEachB(b => { if (TY[b.t].cat === "house" && ok(b)) okH = true; });
    if (okH) { step = 2; guide(); } else say("第 2 步：在剛鋪好的路旁蓋一間「民居」", "自動建屋", () => {
      for (let x = DOCK.x; x >= DOCK.x - 5; x--) for (const dy of [-1, 1]) {
        const y = DOCK.y + dy;
        if (inW(x, y) && !isW(x, y) && !hasRoad(x, y) && !getB(x, y) && roadAdj(x, y) && S.m >= 80) {
          S.m -= 80; addB({ x, y, t: "h1", c: 80, p: 0, prog: 0, in: {}, out: {}, cash: 0, st: "興建中", workers: [] }); guide(); return;
        }
      }
    });
  } else if (step === 2) {
    let okP = false; forEachB(b => { const c = TY[b.t].cat; if ((c === "farm" || c === "shop" || c === "work") && ok(b)) okP = true; });
    if (okP) { step = 3; say("小鎮已開始運轉：點擊居民可查看個人檔案，點擊建築可看庫存與營收"); }
    else say("第 3 步：在路旁蓋「農田」或「商鋪」提供工作與食物");
  }
}

function findPath(x0, y0, x1, y1) {
  const q = [[x0, y0]], prev = new Int32Array(N * N).fill(-1);
  prev[K(x0, y0)] = K(x0, y0);
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    if (x === x1 && y === y1) {
      const p = []; let c = K(x1, y1);
      while (c !== K(x0, y0)) { p.push([c % N + .5, (c / N | 0) + .5]); c = prev[c]; }
      return p.reverse();
    }
    for (const d of D4) {
      const nx = x + d[0], ny = y + d[1];
      if (hasRoad(nx, ny) && prev[K(nx, ny)] === -1) { prev[K(nx, ny)] = K(x, y); q.push([nx, ny]); }
    }
  }
  return null;
}

function spawnW(a, b, col, carriedGood, rid) {
  if (walkers.length > 48) return;
  const r1 = D4.map(d => [a.x + d[0], a.y + d[1]]).find(p => inW(p[0], p[1]) && conn[K(p[0], p[1])]);
  const r2 = D4.map(d => [b.x + d[0], b.y + d[1]]).find(p => inW(p[0], p[1]) && conn[K(p[0], p[1])]);
  if (!r1 || !r2) return;
  const path = findPath(r1[0], r1[1], r2[0], r2[1]);
  if (path && path.length > 1) {
    walkers.push({ x: path[0][0], y: path[0][1], path, i: 0, col: col || "#2f5d62", good: carriedGood || null, rid: rid || null });
  }
}

function income(b, gross, rate) {
  const tax = +(gross * rate).toFixed(2);
  b.cash += gross - tax; S.m += tax;
  stat.tax = (stat.tax || 0) + tax;
  flows.tax = (flows.tax || 0) + tax;
}

// 每日生活、婚姻、生育與消費循環（第一階段深化）
function bgDay() {
  ensureHouseholds();
  assignWorkers();

  const wList = Array.from(residents.values());
  // 1. 居民工作領薪與經驗成長
  for (const r of wList) {
    if (r.jobKey) {
      // 有工作的居民每日領取底薪，並隨教育普及率與文教投入進行「學徒進修」（第六章、第九章）
      const jb = bm.get(r.jobKey);
      if (jb && ok(jb)) {
        const oldTier = (r.skill || 0) >= 65 ? 2 : (r.skill || 0) >= 28 ? 1 : 0;
        const basePay = 12 + Math.floor((r.skill || 0) / 8);
        const paid = Math.min(Math.max(0, jb.cash || 0), basePay);
        jb.cash = Math.max(0, (jb.cash || 0) - paid);
        r.wallet = (r.wallet || 0) + paid;
        if (paid < basePay * 0.5) r.mood = Math.max(0, r.mood - 2);
        const eduRate = getEduCoverage() / 100;
        const budgetBonus = Math.min(1.5, (GOV.eduBudget || 0) / 40);
        const learnGain = 0.9 + eduRate * 1.4 + budgetBonus * 0.8;
        r.skill = Math.min(100, (r.skill || 0) + learnGain);
        const newTier = r.skill >= 65 ? 2 : r.skill >= 28 ? 1 : 0;
        if (newTier > oldTier) {
          const ci = getCareerInfo(r);
          r.log.push("第" + (day + 1) + "日 晉升為「" + ci.title + "」");
          addChronicle("匠藝", r.name + "刻苦進修，於" + TY[jb.t].n + "晉升為「" + ci.title + "」！", "promo_" + r.id + "_" + newTier);
        }
      } else {
        r.jobKey = null;
      }
    } else if (r.age >= 18 && r.age <= 65) {
      r.mood = Math.max(20, r.mood - 1);
    }
    // 偶爾在鎮上散步
    if (Math.random() < 0.35 && blds.length > 0) {
      const hb = bm.get(r.houseKey);
      const target = r.jobKey ? bm.get(r.jobKey) : cachedGroups.find(b => b !== hb && ok(b));
      if (hb && target) spawnW(hb, target, r.gender === "f" ? "#a64b63" : "#2f5d62", null, r.id);
    }
  }

  // 2. 婚姻撮合與新生兒（每 5 天評估一次）
  if (day > 0 && day % 5 === 0) {
    const singlesM = wList.filter(r => r.gender === "m" && !r.spouseId && r.age >= 20 && r.age <= 45);
    const singlesF = wList.filter(r => r.gender === "f" && !r.spouseId && r.age >= 20 && r.age <= 45);
    if (singlesM.length > 0 && singlesF.length > 0 && Math.random() < 0.45) {
      const m = singlesM[0], f = singlesF[0];
      m.spouseId = f.id; f.spouseId = m.id;
      m.mood = Math.min(100, m.mood + 15); f.mood = Math.min(100, f.mood + 15);
      m.log.push("第" + (day + 1) + "日 與" + f.name + "結為連理");
      f.log.push("第" + (day + 1) + "日 與" + m.name + "結為連理");
      addChronicle("喜事", m.name + "與" + f.name + "在江畔喜結連理，鄰里同賀！");
    }
    // 夫妻家庭生育
    for (const hh of households.values()) {
      const b = bm.get(hh.houseKey);
      const cap = b ? (b.t === "h1" ? 2 : b.t === "h2" ? 3 : 4) : 2;
      if (hh.members.length < cap && Math.random() < 0.22) {
        const p1 = residents.get(hh.members[0]);
        if (p1 && p1.spouseId) {
          const baby = createResident(hh.houseKey, 0, Math.random() < 0.5 ? "m" : "f", p1.name[0]);
          baby.log = ["第" + (day + 1) + "日 誕生於江畔小鎮"];
          hh.members.push(baby.id);
          addChronicle("新丁", p1.name + "家喜添新丁「" + baby.name + "」，小鎮人丁更旺！");
        }
      }
    }
  }

  // 3. 歲數增長（每 60 天計為 1 歲）
  if (day > 0 && day % 60 === 0) {
    for (const r of wList) r.age += 1;
    addChronicle("歲時", "時光荏苒，小鎮迎來新的一年（建鎮第 " + (Math.floor(day / 60) + 1) + " 年）。", "year_" + Math.floor(day / 60));
  }
}

// 每日商鋪稅收結算（第二階段）：確保店鋪獲利能轉為鎮庫財政收入
function collectDailyTax() {
  let taxTotal = 0;
  forEachB(b => {
    const T = TY[b.t];
    if (b.p < 1 || (T.cat !== "shop" && T.cat !== "work")) return;
    const prev = cashSnap.get(b.hk) ?? b.cash;
    const profit = b.cash - prev;
    if (profit > 0) {
      const rate = T.cat === "shop" ? 0.12 : 0.08;
      const tax = Math.floor(profit * rate);
      if (tax > 0 && b.cash >= tax) {
        b.cash -= tax;
        taxTotal += tax;
        stat.tax = (stat.tax || 0) + tax;
        flows.tax = (flows.tax || 0) + tax;
      }
    }
    cashSnap.set(b.hk, b.cash);
  });
  if (taxTotal > 0) S.m += taxTotal;
  const eduSpend = Math.min(S.m, GOV.eduBudget || 0);
  S.m = Math.max(0, S.m - eduSpend);
}

// 每日天象與事件演進（第一章、第十章）
function dailyWeatherAndEvents() {
  const sIdx = getCurSeason();
  // 自動天氣演進
  if (weatherAuto) {
    const r = Math.random();
    if (sIdx === 1) { // 夏季多雨與暴雨
      weatherId = r < 0.42 ? "clear" : r < 0.78 ? "rain" : r < 0.93 ? "storm" : "fog";
    } else if (sIdx === 3) { // 冬季多晴冷與江霧
      weatherId = r < 0.55 ? "clear" : r < 0.72 ? "rain" : r < 0.76 ? "storm" : "fog";
    } else { // 春秋多晴朗與細雨
      weatherId = r < 0.62 ? "clear" : r < 0.88 ? "rain" : r < 0.94 ? "storm" : "fog";
    }
  }
  // 暴雨觸發「江道泥沙淤積」事件鏈
  if (weatherId === "storm" && !dockSilted && !activeChain && Math.random() < 0.45) {
    dockSilted = true;
    activeChain = { key: "silt_crisis", startDay: day, resolved: false, choice: null, endDay: day + 3 };
    addChronicle("災異", "連日暴雨引發上游泥沙沖刷，碼頭航道嚴重淤塞！", "silt_" + day);
  }
  // 清理已過期的單次事件與事件鏈
  if (activeEvent && day >= activeEvent.endDay) activeEvent = null;
  if (activeChain && day >= activeChain.endDay) {
    if (activeChain.key === "silt_crisis") dockSilted = false;
    activeChain = null;
  }
  // 隨機觸發日常天象/市集事件或百工事件鏈
  if (!activeEvent && !activeChain && day >= 2 && Math.random() < 0.24) {
    if (Math.random() < 0.25 && residents.size >= 4) {
      activeChain = { key: "guild_dispute", startDay: day, resolved: false, choice: null, endDay: day + 2 };
      addChronicle("政務", "作坊與商鋪因批發定價起爭執，百工行會請求官府裁斷。", "guild_" + day);
    } else {
      const ev = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
      activeEvent = Object.assign({}, ev, { endDay: day + ev.dur });
      addChronicle("時事", ev.n + "：" + ev.desc, "ev_" + ev.id + "_" + day);
    }
  }
  updateWxBar();
}

function resolveEventChain(optId) {
  if (!activeChain || activeChain.resolved) return;
  const ch = EVENT_CHAINS[activeChain.key];
  const opt = ch.options.find(o => o.id === optId);
  if (!opt) return;
  if (opt.cost > 0 && S.m < opt.cost) {
    say("鎮庫資金不足（需要 " + opt.cost + " 景元）");
    return;
  }
  if (opt.cost > 0) S.m -= opt.cost;
  activeChain.resolved = true;
  activeChain.choice = optId;
  if (activeChain.key === "silt_crisis") {
    if (optId === "dredge") {
      dockSilted = false;
      activeChain.endDay = day + 1;
      activeChain.moodDelta = 4;
      addChronicle("政績", "官府撥款 180 景元疏濬碼頭航道，商船得以順利通航！");
    } else {
      activeChain.endDay = day + 3;
      activeChain.moodDelta = -3;
      addChronicle("時事", "官府暫緩清淤，碼頭航道預計三日後方能自然沖散。");
    }
  } else if (activeChain.key === "guild_dispute") {
    if (optId === "subsidy") {
      activeChain.endDay = day + 1;
      activeChain.moodDelta = 5;
      addChronicle("政績", "官府出資 120 景元補貼平抑物價，百工行會與商鋪重歸於好。");
    } else {
      activeChain.endDay = day + 2;
      activeChain.moodDelta = -4;
      addChronicle("時事", "官府放任市場自行議價，市井物價波動令民心微降。");
    }
  }
  updateWxBar();
  if (wxOpen) renderWxModal();
}

function produce(b) {
  const T = TY[b.t]; if (!T.rec) return;
  if (!ok(b)) { b.st = "未連路"; return; }
  const wk = (b.workers || []).length;
  if (wk === 0) { b.st = "缺人手（需居民）"; return; }
  const ins = Object.entries(T.rec.in);
  if (ins.some(([g, n]) => (b.in[g] || 0) < n)) { b.st = "缺原料"; return; }
  if (Object.values(b.out).reduce((a, c) => a + c, 0) >= 12) { b.st = "庫存已滿"; return; }
  // 季節、天氣與事件對生產速率的加成/減損
  let rateMult = 1.0;
  const env = evalEnvForBuilding(b);
  const zoneMult = env.zoneMatch === true ? 1.18 : env.zoneMatch === false ? 0.88 : 1.0;
  // 員工職業等級加成（學徒 1.0x → 熟練 1.15x → 師傅 1.35x）
  let staffMult = 1.0;
  if (b.workers && b.workers.length > 0) {
    let sum = 0;
    b.workers.forEach(wid => { const wr = residents.get(wid); sum += wr ? getCareerInfo(wr).qualMult : 1.0; });
    staffMult = sum / b.workers.length;
  }
  if (T.cat === "farm") {
    const sMult = SEASONS[getCurSeason()].farmMult || 1.0;
    const wMult = getCurWeather().farmMult || 1.0;
    const eMult = (activeEvent && activeEvent.farmMult) ? activeEvent.farmMult : 1.0;
    const cMult = (activeChain && activeChain.farmMult) ? activeChain.farmMult : 1.0;
    rateMult = sMult * wMult * eMult * cMult * zoneMult * staffMult;
  } else {
    rateMult = zoneMult * staffMult;
  }
  b.prog = Math.min(1.5, (b.prog || 0) + .55 * rateMult);
  b.st = "生產中（" + wk + "/" + (T.jobs || 3) + "人）";
  if (b.prog >= 1) {
    b.prog -= 1;
    ins.forEach(([g, n]) => b.in[g] -= n);
    Object.entries(T.rec.out).forEach(([g, n]) => b.out[g] = (b.out[g] || 0) + n);
    b.st = "正常";
  }
}

function buy(b, g, maxA, allowDock) {
  if ((b.in[g] || 0) >= maxA) return;
  let best = null, bd = 1e9;
  forEachB(s => {
    if (s !== b && s.p >= 1 && ok(s) && (s.out[g] || 0) >= 1) {
      const d = Math.hypot(s.x - b.x, s.y - b.y);
      if (d < bd) { bd = d; best = s; }
    }
  });
  if (best) {
    const amount = Math.min(maxA - (b.in[g] || 0), Math.floor(best.out[g]), Math.floor(b.cash / GD[g].v));
    if (amount >= 1) {
      const cost = amount * GD[g].v;
      best.out[g] -= amount; b.in[g] = (b.in[g] || 0) + amount; b.cash -= cost;
      income(best, cost, .05);
      flows["loc_" + g] = (flows["loc_" + g] || 0) + amount;
      const wId = (b.workers && b.workers[0]) || null;
      spawnW(best, b, "#2d7d6f", g, wId);
    }
  } else if (allowDock && conn[K(DOCK.x, DOCK.y)]) {
    // 碼頭外購價格受季節與航道淤積影響
    const impMult = dockSilted ? 1.55 : 1.15;
    const pr = Math.ceil(GD[g].v * impMult);
    const amount = Math.min(maxA - (b.in[g] || 0), Math.floor(b.cash / pr));
    if (amount >= 1) {
      const envB = evalEnvForBuilding(b);
      const cost = +(amount * pr * envB.transportCostMult).toFixed(2);
      b.in[g] = (b.in[g] || 0) + amount; b.cash -= cost;
      stat.imp = (stat.imp || 0) + cost;
      flows["imp_" + g] = (flows["imp_" + g] || 0) + amount;
      const wId = (b.workers && b.workers[0]) || null;
      spawnW({ x: DOCK.x, y: DOCK.y }, b, "#5f8c8a", g, wId);
    }
  }
}

function tick() {
  ensureHouseholds();
  assignWorkers();
  stat = {}; flows = {};
  forEachB(b => { if (b.p < 1) b.p = Math.min(1, b.p + 1 / (TY[b.t].bt || 12)); });
  let pop = 0, jobs = 0, pkv = 0;
  pop = residents.size;
  forEachB(b => {
    const T = TY[b.t]; if (b.p < 1) return;
    if (T.cat === "park") { pkv += .25; return; }
    if (!ok(b)) return;
    if (T.cat !== "house") jobs += (T.jobs || 3);
    if (T.cat === "farm" || T.cat === "work") {
      if (T.rec) Object.keys(T.rec.in).forEach(g => buy(b, g, 4, true));
      produce(b);
    } else if (T.cat === "shop") {
      const wk = (b.workers || []).length;
      if (wk === 0) { b.st = "缺掌櫃（需居民）"; return; }
      T.sells.forEach(g => {
        buy(b, g, 6, true);
        if ((b.in[g] || 0) > 0) { b.out[g] = (b.out[g] || 0) + b.in[g]; b.in[g] = 0; }
      });
      b.st = Object.values(b.out).some(v => v >= 1) ? "營業中（" + wk + "人）" : "缺貨";
    }
  });
  pkv = Math.min(1, pkv);

  // 2. 優先滿足居民主食需求（消費與家庭庫存連動）
  const foodDem = pop * 0.25;
  let foodSup = 0;
  forEachB(b => {
    const T = TY[b.t];
    if (b.p >= 1 && ok(b) && (T.cat === "shop" || T.cat === "work" || T.cat === "farm")) {
      foodSup += (b.out.noodle || 0);
    }
  });
  const isUrgentFood = foodSup < foodDem * 0.8;

  const buyFrom = (s, g, req) => {
    if (req <= 0) return 0;
    const stock = s.out[g] || 0;
    const baseResRatio = GOV.grainPolicy === "reserve" ? 0.45 : GOV.grainPolicy === "relief" ? 0.05 : 0.25;
      const reserveStock = (g === "noodle" && !isUrgentFood) ? Math.floor(stock * baseResRatio) : 0;
    const avail = Math.max(0, stock - reserveStock);
    if (avail <= 0) return 0;

    const take = Math.min(avail, req);
    s.out[g] -= take;
    const spent = take * GD[g].v;
    income(s, spent, .30);
    stat.ret = (stat.ret || 0) + spent;
    flows["ret_" + g] = (flows["ret_" + g] || 0) + take;
    return take;
  };

  let eat = 0;
  const shopNoodle = [];
  const otherNoodle = [];
  forEachB(s => {
    const T = TY[s.t];
    if (s.p >= 1 && ok(s) && (s.out.noodle || 0) > 0) {
      if (T.cat === "shop") shopNoodle.push(s);
      else otherNoodle.push(s);
    }
  });
  for (const s of shopNoodle) { if (eat >= foodDem) break; eat += buyFrom(s, "noodle", foodDem - eat); }
  for (const s of otherNoodle) { if (eat >= foodDem) break; eat += buyFrom(s, "noodle", foodDem - eat); }
  sat.noodle = pop ? Math.min(1, eat / foodDem) : 1;

  // 3. 日用品需求
  const gDem = pop * 0.14;
  let gs = 0;
  if (pop > 0 && gDem > 0) {
    const gList = ["pottery", "wood", "cloth", "iron", "wine"];
    const dEach = gDem / gList.length;
    let totalBought = 0;
    for (const g of gList) {
      let left = dEach;
      forEachB(s => {
        if (left <= 0 || s.p < 1 || !ok(s)) return;
        const T = TY[s.t];
        if (T.cat !== "shop") return;
        const stock = s.out[g] || 0;
        if (stock <= 0) return;

        const price = GD[g].v;
        const affordable = Math.min(left, stock);
        if (affordable > 0) {
          s.out[g] -= affordable;
          const spent = affordable * price;
          const effTax = GOV.grainPolicy === "relief" && g === "noodle" ? 0.05 : (GOV.taxRate || 0.25);
      income(s, spent, effTax); left -= affordable;
          stat.ret = (stat.ret || 0) + spent;
          flows["ret_" + g] = (flows["ret_" + g] || 0) + affordable;
          totalBought += affordable;
        }
      });
    }
    gs = Math.min(1, totalBought / gDem);
  } else {
    gs = 1;
  }
  sat.goods = gs;

  // 4. 商人碼頭外銷出清剩餘庫存（受季節、事件與航道淤積影響）
  if (conn[K(DOCK.x, DOCK.y)]) {
    const sMult = SEASONS[getCurSeason()].tradeMult || 1.0;
    const eMult = (activeEvent && activeEvent.tradeMult) ? activeEvent.tradeMult : 1.0;
    const siltMult = dockSilted ? 0.45 : 1.0;
    const expScale = 0.85 * sMult * eMult * siltMult;
    forEachB(b => {
      const T = TY[b.t];
      if (b.p >= 1 && ok(b) && (T.cat === "farm" || T.cat === "work")) {
        let sp = 0;
        Object.keys(b.out).forEach(g => {
          const isReservedFood = (g === "noodle" && isUrgentFood);
          const minKeep = isReservedFood ? 8 : (g === "noodle" ? 3 : 2);
          const v = b.out[g] || 0;
          if (v > minKeep) {
            const ex = Math.min(v - minKeep, 5) * expScale;
            b.out[g] -= ex;
            const spent = ex * GD[g].v * 1.1;
            stat.exp = (stat.exp || 0) + spent;
            flows["exp_" + g] = (flows["exp_" + g] || 0) + ex;
            sp += spent;
          }
        });
        if (spent > 0) { income(b, spent, GOV.taxRate || 0.25); sp += spent; }
        if (sp > 0) spawnW(b, { x: DOCK.x, y: DOCK.y }, "#b57c2a");
      }
    });
  }

  // 5. 需求缺口計算
  need = {}; shopNeed = {}; want = {};
  forEachB(b => {
    const T = TY[b.t]; if (b.p < 1 || !ok(b)) return;
    if (T.rec) Object.keys(T.rec.in).forEach(g => {
      const d = Math.max(0, 3 - (b.in[g] || 0));
      if (d > 0) need[g] = (need[g] || 0) + d;
    });
    if (T.sells) T.sells.forEach(g => {
      const d = Math.max(0, 4 - (b.out[g] || 0));
      if (d > 0) shopNeed[g] = (shopNeed[g] || 0) + d;
    });
  });

  if (pop > 0) {
    if (foodSup < foodDem * 1.5) want.noodle = Math.ceil(foodDem * 1.5 - foodSup);
    if (sat.goods < 0.7) {
      ["pottery", "wood", "cloth", "iron", "wine"].forEach(g => {
        let sup = 0;
        forEachB(b => { if (b.p >= 1 && ok(b) && TY[b.t].cat === "shop") sup += (b.out[g] || 0); });
        if (sup < pop * 0.1) want[g] = Math.ceil(pop * 0.15 - sup);
      });
    }
  }

  const emp = pop ? Math.min(1, jobs / pop) : 1;
  const civic = getCivicStats();
  const eduCov = getEduCoverage();
  let houseNoiseSum = 0, houseCnt = 0;
  forEachB(hb => { if (hb.p >= 1 && TY[hb.t].cat === "house") { houseNoiseSum += evalEnvForBuilding(hb).noise; houseCnt++; } });
  const avgNoise = houseCnt ? (houseNoiseSum / houseCnt) : 0;
  const orderMood = GOV.orderPolicy === "strict" ? -4 : GOV.orderPolicy === "lenient" ? 2 : 0;
  const civicBonus = ((civic.security - 50) * 0.08) + ((civic.health - 50) * 0.08) + (eduCov * 0.05) - (avgNoise * 0.35) + orderMood;
  const wxMood = (getCurWeather().moodDelta || 0) + ((activeEvent && activeEvent.moodDelta) ? activeEvent.moodDelta : 0) + ((activeChain && activeChain.moodDelta) ? activeChain.moodDelta : 0);
  const hap = Math.max(0, Math.min(100, 100 * (.5 * sat.noodle + .2 * gs + .15 * emp + .15 * pkv) + wxMood + civicBonus));
  S.p = pop; S.j = jobs; S.h = Math.round(hap);

  // 同步更新居民個人心情指數
  for (const r of residents.values()) {
    r.mood = clamp(Math.round(r.mood * 0.6 + hap * 0.4), 10, 100);
  }

  $("#m").textContent = Math.floor(S.m); $("#p").textContent = pop; $("#j").textContent = jobs; $("#h").textContent = S.h;
  if (step < 3) guide();
  else {
    const lk = Object.entries(need).sort((a, b) => b[1] - a[1])[0];
    const sk = Object.entries(shopNeed).sort((a, b) => b[1] - a[1])[0];
    const wk = Object.entries(want).sort((a, b) => b[1] - a[1])[0];
    if (lk) say("生產急需原料【" + GD[lk[0]].n + "】（尚缺約 " + Math.ceil(lk[1]) + " 件）");
    else if (wk) say("民生急需【" + GD[wk[0]].n + "】（尚缺約 " + Math.ceil(wk[1]) + " 件）");
    else if (sk) say("商鋪缺貨【" + GD[sk[0]].n + "】，可建設對應作坊");
    else if (pop && jobs > pop) say("職缺還有 " + (jobs - pop) + " 個，多蓋民居招人吧");
    else say("市鎮物資充裕，點擊居民看故事，或點「天象」查看節氣");
  }
  if (ecoOpen) renderEco();
  if (rosterOpen) renderRoster();
  if (chronOpen) renderChronicle();
  if (wxOpen) renderWxModal();
  if (selResId && residents.has(selResId)) showResident(selResId);
  if (cardB) showCard(cardB);
}

function showCard(b) {

  if (b.p >= 1 && T.cat !== "house" && T.cat !== "park" && T.k !== "well") {
    const li = o => Object.keys(o || {}).filter(g => o[g] >= 1).map(g => GD[g].n + " " + Math.floor(o[g])).join("、") || "無";
    t += "\n營運資金 " + Math.floor(b.cash || 0) + " 景元・員工 " + (b.workers || []).length + "/" + (T.jobs || 3) + "\n庫存：" + li(b.out) + (T.rec && Object.keys(T.rec.in).length ? "\n原料：" + li(b.in) : "");
  }
  $("#cardT").textContent = t; $("#cardDel").textContent = "移除（退還 " + b.c + " 文）"; $("#card").style.display = "flex";
}

function renderEco() {
  const f = v => (v || 0).toFixed(1), p = v => Math.round((v || 0) * 100) + "%";
  const gs = Object.keys(GD), st = {}, lc = {}, im = {}, rt = {}, ex = {};
  gs.forEach(g => st[g] = lc[g] = im[g] = rt[g] = ex[g] = 0);
  forEachB(b => { if (b.p >= 1) gs.forEach(g => { st[g] += (b.in[g] || 0) + (b.out[g] || 0); }); });
  Object.keys(flows).forEach(k => {
    const [tp, g] = k.split("_");
    if (tp === "loc") lc[g] += flows[k];
    else if (tp === "imp") im[g] += flows[k];
    else if (tp === "ret") rt[g] += flows[k];
    else if (tp === "exp") ex[g] += flows[k];
  });
  const rows = gs.filter(g => st[g] > 0.1 || lc[g] > 0.1 || im[g] > 0.1 || rt[g] > 0.1 || ex[g] > 0.1 || need[g] > 0 || shopNeed[g] > 0 || want[g] > 0).map(g => {
    const gap = Math.ceil((need[g] || 0) + (shopNeed[g] || 0) + (want[g] || 0));
    return "<tr><td><b>" + GD[g].n + "</b></td><td>" + f(st[g]) + "</td><td>" + f(lc[g]) + "</td><td>" + f(im[g]) + "</td><td>" + f(rt[g]) + "</td><td>" + f(ex[g]) + "</td><td>" + (gap > 0 ? "<span style='color:#9a3b2e'>" + gap + "</span>" : "0") + "</td></tr>";
  }).join("");
  $("#ecoB").innerHTML =
    "<div><b>民生指標</b>：熱麵滿足 " + p(sat.noodle) + " · 日用品 " + p(sat.goods) + " · 民心 " + S.h + " · 建鎮第 " + (day + 1) + " 日</div>" +
    "<div><b>鎮庫現金流</b>：上週期 零售收入 " + f(stat.ret) + " 景元 · 外貿出清 " + f(stat.exp) + " 景元 · 稅收 " + f(stat.tax) + " 景元 · 碼頭外購 " + f(stat.imp) + " 景元</div>" +
    "<div style='margin-top:6px'><b>全鎮物資流轉表（件）</b></div>" +
    "<table><tr><th>物資</th><th>現有庫存</th><th>本地採購</th><th>碼頭外購</th><th>居民零售</th><th>碼頭外銷</th><th>總缺口</th></tr>" + (rows || "<tr><td colspan='7' style='text-align:center'>尚無物資流通</td></tr>") + "</table>";
}

function getWorkplacesList() {

      list.push({ hk: b.hk, label: T.n + " (" + (b.workers || []).length + "/" + (T.jobs || 3) + ")" });

  });
  return list;
}

function poly(pts, fill, stroke, lw = 1) {
  cx.beginPath(); cx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) cx.lineTo(pts[i][0], pts[i][1]);
  cx.closePath();
  if (fill) { cx.fillStyle = fill; cx.fill(); }
  if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = lw; cx.stroke(); }
}

function tile(x, y, fill, stroke) { poly([iso(x, y), iso(x + 1, y), iso(x + 1, y + 1), iso(x, y + 1)], fill, stroke, .75); }

function box(x0, y0, x1, y1, z0, z1, cl, cr, ct) {
  const P = (x, y, z) => { const p = iso(x, y); return [p[0], p[1] - z]; };
  const a = P(x0, y1, z0), b = P(x1, y1, z0), c = P(x1, y0, z0), d = P(x0, y1, z1), e = P(x1, y1, z1), f = P(x1, y0, z1), g = P(x0, y0, z1);
  if (cl) poly([a, b, e, d], cl, "rgba(25,22,18,.28)", .7);
  if (cr) poly([b, c, f, e], cr, "rgba(25,22,18,.28)", .7);
  if (ct) poly([d, e, f, g], ct, "rgba(25,22,18,.22)", .7);
}

function roof(x, y, z, h, ew, eh, cs) {
  const P = (u, v, w) => { const p = iso(u, v); return [p[0], p[1] - w]; };
  const x0 = x - .06, y0 = y - .06, x1 = x + 1.06, y1 = y + 1.06, mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  const a = P(x0, y1, z), b = P(x1, y1, z), c = P(x1, y0, z), d = P(x0, y0, z);
  const p = P(mx - ew, my - eh, z + h), q = P(mx + ew, my + eh, z + h);
  poly([a, b, q, p], cs[0], "rgba(25,22,18,.3)", .8);
  poly([b, c, q], cs[1], "rgba(25,22,18,.3)", .8);
  poly([c, d, p, q], cs[2], "rgba(25,22,18,.3)", .8);
  poly([d, a, p], cs[1], "rgba(25,22,18,.3)", .8);
}

function drawPark(b, T, ts) {
  const { x, y, p } = b, P = (u, v, z = 0) => { const q = iso(u, v); return [q[0], q[1] - z]; };
  const shade = (rx, ry) => { const q = P(x + .5, y + .5); cx.fillStyle = "rgba(20,40,32,.15)"; cx.beginPath(); cx.ellipse(q[0], q[1] + 2, rx * p, ry * p, 0, 0, 6.28); cx.fill(); };
  const puff = (u, v, z, r, c1, c2) => { const q = P(u, v, z); cx.fillStyle = c1; cx.beginPath(); cx.arc(q[0], q[1], r * p, 0, 6.28); cx.fill(); cx.fillStyle = c2; cx.beginPath(); cx.arc(q[0] - r * .25 * p, q[1] - r * .25 * p, r * .62 * p, 0, 6.28); cx.fill(); };
  const k = T.k;
  if (k === "well") {
    shade(12, 5);
    poly([P(x + .25, y + .25), P(x + .75, y + .25), P(x + .75, y + .75), P(x + .25, y + .75)], "#b5afa2", false);
    box(x + .34, y + .34, x + .66, y + .66, 0, 7 * p, "#8d8a82", "#6e6b64", "#4f86a6");
    box(x + .32, y + .48, x + .36, y + .52, 7 * p, 18 * p, "#6b4f3a", "#523b2b", null);
    box(x + .64, y + .48, x + .68, y + .52, 7 * p, 18 * p, "#6b4f3a", "#523b2b", null);
    roof(x + .22, y + .28, 17 * p, 6 * p, 0, 0, ["#8a5a3a", "#6b4329", "#a36d49"]);
    return;
  }
  if (k === "willow") {
    shade(15, 7); box(x + .45, y + .45, x + .55, y + .55, 0, 12 * p, "#6e4e35", "#543a26", null);
    const sw = Math.sin(ts / 700 + x) * 1.4;
    puff(x + .5, y + .5, 16 * p, 11, "#629c55", "#86bd6d"); puff(x + .34, y + .6, 13 * p, 7, "#528a49", "#78b062"); puff(x + .66, y + .4, 14 * p, 7.5, "#6aa45c", "#90c677");
    cx.strokeStyle = "#5b9350"; cx.lineWidth = 1.2;
    for (let i = -3; i <= 3; i++) { const q = P(x + .5 + i * .07, y + .5 - i * .05, 14 * p); cx.beginPath(); cx.moveTo(q[0], q[1]); cx.quadraticCurveTo(q[0] + sw, q[1] + 7 * p, q[0] + sw * 1.4, q[1] + 13 * p); cx.stroke(); }
  } else if (k === "flower") {
    tile(x + .08, y + .08, "#93a356", "rgba(70,80,40,.3)");
    const cs = ["#e86f7c", "#f3c74f", "#f6efe2", "#a579d6", "#ef8f52"];
    for (let i = 0; i < 14; i++) { const q = P(x + .2 + (i % 4) * .2, y + .2 + ((i / 4) | 0) * .2, 2 * p); cx.fillStyle = cs[i % 5]; cx.beginPath(); cx.arc(q[0], q[1], 2.2 * p, 0, 6.28); cx.fill(); }
  } else if (k === "pond") {
    const pts = []; for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28, r = .38 + (i % 2) * .04; pts.push(P(x + .5 + Math.cos(a) * r, y + .5 + Math.sin(a) * r)); }
    poly(pts, "#5798b4", "#b7ae99", 2);
    const l1 = P(x + .38, y + .45, .5), l2 = P(x + .62, y + .56, .5);
    cx.fillStyle = "#5f9a53"; cx.beginPath(); cx.ellipse(l1[0], l1[1], 4 * p, 2.2 * p, 0, 0, 6.28); cx.ellipse(l2[0], l2[1], 3.5 * p, 2 * p, .4, 0, 6.28); cx.fill();
    cx.fillStyle = "#f29ab0"; cx.beginPath(); cx.arc(l1[0] + 1, l1[1] - 1, 1.6 * p, 0, 6.28); cx.fill();
    if (b.br) {
      poly([P(x + .06, y + .42, 1), P(x + .5, y + .42, 4.5), P(x + .94, y + .42, 1), P(x + .94, y + .58, 1), P(x + .5, y + .58, 4.5), P(x + .06, y + .58, 1)], "#b58354", "#6e4b2c", .9);
      cx.strokeStyle = "#7a5330"; cx.lineWidth = 1;
      for (const dy of [.43, .57]) { cx.beginPath(); const a = P(x + .12, y + dy, 4), m = P(x + .5, y + dy, 7.5), c = P(x + .88, y + dy, 4); cx.moveTo(a[0], a[1]); cx.lineTo(m[0], m[1]); cx.lineTo(c[0], c[1]); cx.stroke(); }
    }
  } else if (k === "pavilion") {
    shade(16, 8); poly([P(x + .16, y + .16), P(x + .84, y + .16), P(x + .84, y + .84), P(x + .16, y + .84)], "#d7cebc", "rgba(40,35,30,.3)", .8);
    [[.24, .24], [.76, .24], [.76, .76], [.24, .76]].forEach(([u, v]) => box(x + u - .03, y + v - .03, x + u + .03, y + v + .03, 0, 14 * p, "#9b4434", "#753124", null));
    roof(x + .12, y + .12, 14 * p, 11 * p, 0, 0, ["#a54836", "#7d3325", "#bd5a47"]);
  } else if (k === "bamboo") {
    shade(13, 6);
    [[.32, .35, 19], [.52, .28, 22], [.66, .52, 20], [.42, .64, 17], [.58, .66, 18]].forEach(([u, v, h], i) => {
      const q = P(x + u, y + v), t = P(x + u + Math.sin(ts / 800 + i) * .03, y + v, h * p);
      cx.strokeStyle = i % 2 ? "#5e9649" : "#73ab59"; cx.lineWidth = 2.2 * p; cx.beginPath(); cx.moveTo(q[0], q[1]); cx.lineTo(t[0], t[1]); cx.stroke();
      cx.fillStyle = "#8bc26c"; cx.beginPath(); cx.ellipse(t[0] + 3, t[1], 4 * p, 1.6 * p, .4, 0, 6.28); cx.ellipse(t[0] - 3, t[1] + 2, 4 * p, 1.6 * p, -.4, 0, 6.28); cx.fill();
    });
  } else {
    shade(15, 7);
    const rk = (u, v, w, d, h, c1, c2, c3) => box(x + u, y + v, x + u + w, y + v + d, 0, h * p, c1, c2, c3);
    rk(.22, .3, .34, .32, 11, "#8f948e", "#6f746f", "#a7aca5"); rk(.48, .22, .28, .26, 15, "#838882", "#646963", "#9ca19a"); rk(.38, .54, .34, .26, 8, "#989d96", "#777c76", "#b0b5ae");
  }

function drawFarm(b, T, ts) {
  const { x, y, p } = b, P = (u, v, z = 0) => { const q = iso(u, v); return [q[0], q[1] - z]; };
  const k = T.k;
  tile(x + .06, y + .06, k === "clay" ? "#9c7c5c" : k === "ore" ? "#77756f" : k === "rice" ? "#6d9c7a" : "#8b724b", "rgba(45,35,22,.35)");
  if (k === "wheat") {
    for (let i = 0; i < 4; i++) {
      const u = x + .18 + i * .19;
      poly([P(u, y + .12), P(u + .11, y + .12), P(u + .11, y + .88), P(u, y + .88)], "#d9a93f", false);
      for (let j = 0; j < 4; j++) { const q = P(u + .05, y + .22 + j * .18, 4 * p + Math.sin(ts / 500 + i + j)); cx.fillStyle = "#f2cb57"; cx.beginPath(); cx.arc(q[0], q[1], 1.7 * p, 0, 6.28); cx.fill(); }
    }
  } else if (k === "rice") {
    for (let i = 0; i < 4; i++) {
      const u = x + .17 + i * .19;
      poly([P(u, y + .12), P(u + .11, y + .12), P(u + .11, y + .88), P(u, y + .88)], "#84b956", false);
      for (let j = 0; j < 4; j++) { const q = P(u + .05, y + .22 + j * .18, 3 * p); cx.fillStyle = "#a6d66b"; cx.beginPath(); cx.arc(q[0], q[1], 1.5 * p, 0, 6.28); cx.fill(); }
    }
  } else if (k === "cotton") {
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const q = P(x + .24 + i * .26, y + .24 + j * .26, 3 * p);
      cx.fillStyle = "#5f8c4a"; cx.beginPath(); cx.arc(q[0], q[1] + 1, 3 * p, 0, 6.28); cx.fill();
      cx.fillStyle = "#f7f4ec"; cx.beginPath(); cx.arc(q[0], q[1] - 1, 2.4 * p, 0, 6.28); cx.fill();
    }
  } else if (k === "clay") {
    poly([P(x + .2, y + .24), P(x + .78, y + .2), P(x + .82, y + .76), P(x + .24, y + .8)], "#7d5b3e", "#5b412b", 1);
    box(x + .58, y + .56, x + .82, y + .8, 0, 5 * p, "#b87a4b", "#925e36", "#cf8f5d");
  } else if (k === "timber") {
    [[.26, .3, 14], [.68, .28, 16], [.3, .72, 13]].forEach(([u, v, h]) => {
      box(x + u - .04, y + v - .04, x + u + .04, y + v + .04, 0, h * .5 * p, "#6e4e35", "#523824", null);
      const q = P(x + u, y + v, h * .7 * p); cx.fillStyle = "#568c4c"; cx.beginPath(); cx.arc(q[0], q[1], 7 * p, 0, 6.28); cx.fill();
    });
    box(x + .54, y + .58, x + .84, y + .78, 0, 4 * p, "#a57449", "#805734", "#bf8b5c");
  } else {
    poly([P(x + .22, y + .26), P(x + .76, y + .22), P(x + .8, y + .74), P(x + .26, y + .78)], "#57554f", "#3e3c37", 1);
    box(x + .2, y + .18, x + .46, y + .42, 0, 9 * p, "#8a6a4b", "#6b5037", "#a37f5c");
  }
}

function drawB(b, ts) {

  roof(x + .1, y + .1, h, r, T.cat === "house" ? .14 : 0, T.cat === "house" ? -.14 : 0, T.f);
  if (T.d === "door" || T.d === "win" || T.d === "two") {
    poly([P(x + .42, y + .88, 0), P(x + .56, y + .88, 0), P(x + .56, y + .88, 8 * p), P(x + .42, y + .88, 8 * p)], "#765134");

  } else if (T.d === "awn" || T.d === "cloth") {
    poly([P(x + .18, y + .88, 11 * p), P(x + .82, y + .88, 11 * p), P(x + .86, y + 1.03, 7 * p), P(x + .14, y + 1.03, 7 * p)], T.d === "cloth" ? "#4c728c" : "#c85b46", "rgba(30,20,15,.25)", .6);
  } else if (T.d === "pot" || T.d === "jar") {

  } else if (T.d === "wood" || T.d === "log") {
    box(x + .2, y + .9, x + .54, y + 1.02, 0, 4.5 * p, "#a8794c", "#835b36", "#c29161");
  } else if (T.d === "iron" || T.d === "anvil") {
    box(x + .28, y + .91, x + .48, y + 1.01, 0, 4 * p, "#464c54", "#31363c", "#666e78");
  } else if (T.d === "flag" || T.d === "sign") {
    const a = P(x + .82, y + .9, 4 * p), c = P(x + .82, y + .9, 20 * p);
    cx.strokeStyle = "#5c3f28"; cx.lineWidth = 1.4; cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(c[0], c[1]); cx.stroke();
    poly([c, [c[0] + 7, c[1] + 2], [c[0] + 7, c[1] + 9], [c[0], c[1] + 7]], T.d === "flag" ? "#c94b3b" : "#e6c373");
  } else if (T.d === "kiln" || T.d === "steam") {
    box(x + .66, y + .18, x + .8, y + .32, h, h + 9 * p, "#776b62", "#595049", "#443d38");
    const q = P(x + .73, y + .25, h + 11 * p + (ts / 90) % 8); cx.fillStyle = "rgba(255,255,255,.45)"; cx.beginPath(); cx.arc(q[0], q[1], 3.5, 0, 6.28); cx.fill();
  } else if (T.d === "wheel") {
    const q = P(x + .9, y + .5, 8 * p); cx.strokeStyle = "#7a5638"; cx.lineWidth = 1.8; cx.beginPath(); cx.arc(q[0], q[1], 6 * p, 0, 6.28); cx.stroke();
  }
}

function draw() {
  const w = cv.width, h = cv.height; cx.clearRect(0, 0, w, h);
  cx.save(); cx.translate(cam.x, cam.y); cx.scale(cam.z, cam.z);
  const c0 = tileAt(0, 0), c1 = tileAt(w, 0), c2 = tileAt(w, h), c3 = tileAt(0, h);
  const s0 = Math.min(c0[0] + c0[1], c1[0] + c1[1], c2[0] + c2[1], c3[0] + c3[1]) - 3;
  const s1 = Math.max(c0[0] + c0[1], c1[0] + c1[1], c2[0] + c2[1], c3[0] + c3[1]) + 3;
  const d0 = Math.min(c0[0] - c0[1], c1[0] - c1[1], c2[0] - c2[1], c3[0] - c3[1]) - 3;
  const d1 = Math.max(c0[0] - c0[1], c1[0] - c1[1], c2[0] - c2[1], c3[0] - c3[1]) + 3;
  for (let s = s0; s <= s1; s++) for (let x = 0; x < N; x++) {
    const y = s - x; if (y < 0 || y >= N || x - y < d0 || x - y > d1) continue;
    const n = h2(x, y);
    if (isW(x, y)) {
      tile(x, y, n > .5 ? "#4f96b3" : "#569eb9");
      if (bridges.has(K(x, y))) tile(x + .06, y + .06, "#b58654", "#6e4b2c");
    } else {
      tile(x, y, n > .66 ? "#86c176" : n > .33 ? "#8ec87c" : "#96ce83", "rgba(38,76,56,.08)");
      if (!hasRoad(x, y) && !getB(x, y) && n > .82) {
        const p = iso(x + .5, y + .5); cx.fillStyle = "#5f9d5a"; cx.beginPath(); cx.arc(p[0], p[1] - 3, 5, 0, 6.28); cx.fill();
      }
    }
  }
  const P = (u, v, z = 0) => { const q = iso(u, v); return [q[0], q[1] - z]; };
  for (let s = s0; s <= s1; s++) for (let x = 0; x < N; x++) {
    const y = s - x; if (!hasRoad(x, y) || isW(x, y) || x - y < d0 || x - y > d1) continue;
    const on = conn[K(x, y)], fill = on ? "#dfd0b4" : "#c7baa0", edge = on ? "rgba(92,74,48,.35)" : "rgba(154,59,46,.45)";
    const c = (u, v) => hasRoad(x + u, y + v) || !!getB(x + u, y + v);
    const n = c(0, -1), e = c(1, 0), so = c(0, 1), w2 = c(-1, 0), a = .28, b = .72;
    poly([P(x + a, y + a), P(x + b, y + a), P(x + b, y + b), P(x + a, y + b)], fill);
    if (n) poly([P(x + a, y), P(x + b, y), P(x + b, y + a), P(x + a, y + a)], fill);
    if (so) poly([P(x + a, y + b), P(x + b, y + b), P(x + b, y + 1), P(x + a, y + 1)], fill);
    if (w2) poly([P(x, y + a), P(x + a, y + a), P(x + a, y + b), P(x, y + b)], fill);
    if (e) poly([P(x + b, y + a), P(x + 1, y + a), P(x + 1, y + b), P(x + b, y + b)], fill);
    cx.strokeStyle = edge; cx.lineWidth = .9;
    const ln = (u0, v0, u1, v1) => { const p0 = P(x + u0, y + v0), p1 = P(x + u1, y + v1); cx.beginPath(); cx.moveTo(p0[0], p0[1]); cx.lineTo(p1[0], p1[1]); cx.stroke(); };
    if (!n) ln(a, a, b, a); else { ln(a, 0, a, a); ln(b, 0, b, a); }
    if (!so) ln(a, b, b, b); else { ln(a, b, a, 1); ln(b, b, b, 1); }
    if (!w2) ln(a, a, a, b); else { ln(0, a, a, a); ln(0, b, a, b); }
    if (!e) ln(b, a, b, b); else { ln(b, a, 1, a); ln(b, b, 1, b); }
  }
  // 繪製功能區劃色塊（第八章）
  if (zones.size > 0) {
    zones.forEach((zt, zk) => {
      const zx = zk % N, zy = (zk / N) | 0;
      const zs = zx + zy, zd = zx - zy;
      if (zs < s0 || zs > s1 || zd < d0 || zd > d1) return;
      const zm = ZONE_META[zt];
      if (zm) tile(zx, zy, zm.fill, zm.stroke);
    });
  }
  poly([P(RX, DOCK.y + .2), P(RX + .8, DOCK.y + .2), P(RX + .8, DOCK.y + .8), P(RX, DOCK.y + .8)], "#8b6b4b");
  if (tool === "zone" && zoneDragStart && hov) {
    const x0 = Math.min(zoneDragStart[0], hov[0]), x1 = Math.max(zoneDragStart[0], hov[0]);
    const y0 = Math.min(zoneDragStart[1], hov[1]), y1 = Math.max(zoneDragStart[1], hov[1]);
    const zCol = curT().col || "rgba(255,255,255,.35)";
    for (let xx = x0; xx <= x1; xx++) for (let yy = y0; yy <= y1; yy++) {
      if (inW(xx, yy) && !isW(xx, yy)) tile(xx, yy, zCol, "#1d3a35");
    }
  } else if (hov && tool !== "look" && inW(hov[0], hov[1])) tile(hov[0], hov[1], can(hov[0], hov[1]) ? "rgba(110,220,140,.55)" : "rgba(220,90,70,.55)");
  for (const r of ripples) { const p = iso(RX + 1, r.y); cx.strokeStyle = "rgba(255,255,255," + r.a + ")"; cx.lineWidth = 1; cx.beginPath(); cx.ellipse(p[0], p[1], r.r * 2, r.r, 0, 0, 6.28); cx.stroke(); }
  for (const b of boats) {
    const p = iso(RX + 1, b.y);
    poly([[p[0] - 11, p[1]], [p[0] + 11, p[1]], [p[0] + 7, p[1] + 5], [p[0] - 7, p[1] + 5]], "#7b5334");
    poly([[p[0] - 1, p[1] - 13], [p[0] + 8, p[1] - 4], [p[0] - 1, p[1] - 2]], "#f6efe0");
  }
  const now = performance.now();
  for (let s = s0; s <= s1; s++) for (let x = 0; x < N; x++) {
    const y = s - x; if (x - y < d0 || x - y > d1) continue;
    const b = getB(x, y); if (b && b.x === x && b.y === y) drawB(b, now);
  }
  for (const m of walkers) {
    const p = iso(m.x, m.y);
    cx.fillStyle = m.col; cx.beginPath(); cx.arc(p[0], p[1] - 4, 2.6, 0, 6.28); cx.fill();
    cx.fillStyle = "#f2d6b3"; cx.beginPath(); cx.arc(p[0], p[1] - 8, 2, 0, 6.28); cx.fill();
    if (m.good) {
      cx.fillStyle = "#d39a2f";
      cx.fillRect(p[0] + 2, p[1] - 7, 3, 3);
    }
  }
  cx.restore();

  // 季節色調與雨絲特效疊加
  const sTint = SEASONS[getCurSeason()].skyTint;
  if (sTint) { cx.fillStyle = sTint; cx.fillRect(0, 0, w, h); }
  if (weatherId === "rain" || weatherId === "storm") {
    cx.strokeStyle = weatherId === "storm" ? "rgba(210,230,245,.55)" : "rgba(220,235,245,.36)";
    cx.lineWidth = weatherId === "storm" ? 1.5 : 1;
    cx.beginPath();
    for (const rd of raindrops) {
      cx.moveTo(rd.x, rd.y);
      cx.lineTo(rd.x - 4, rd.y + (weatherId === "storm" ? 16 : 11));
    }
    cx.stroke();
  } else if (weatherId === "fog") {
    cx.fillStyle = "rgba(235,242,240,.22)";
    cx.fillRect(0, 0, w, h);
  }
}

let lastPtrX = 0, lastPtrY = 0;
function down(e) {
  cv.setPointerCapture(e.pointerId);
  lastPtrX = e.clientX; lastPtrY = e.clientY;
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptr.size === 2) {
    const a = [...ptr.values()];
    pinch = { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), z: cam.z, mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2 };
    drag = null; return;
  }
  const t = tileAt(e.clientX, e.clientY); hov = t;
  const pan = tool === "look" || e.button === 2 || e.button === 1;
  drag = { moved: false, pan, zoneBox: !pan && tool === "zone", paint: !pan && (tool === "road" || tool === "del" || tool === "bridge") };
  if (drag.zoneBox) { zoneDragStart = t; }
  else if (drag.paint) { act(t[0], t[1]); lastT = t[0] + "," + t[1]; }
}

function move(e) {
  lastPtrX = e.clientX; lastPtrY = e.clientY;
  const p = ptr.get(e.pointerId);
  if (!p) { hov = tileAt(e.clientX, e.clientY); return; }
  if (ptr.size === 2 && pinch) {
    p.x = e.clientX; p.y = e.clientY;
    const a = [...ptr.values()], d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    const nz = clamp(pinch.z * d / pinch.d, .55, 2.4);
    cam.x = pinch.mx - (pinch.mx - cam.x) * (nz / cam.z); cam.y = pinch.my - (pinch.my - cam.y) * (nz / cam.z); cam.z = nz; return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (!drag) return;
  if (Math.hypot(dx, dy) > 4) drag.moved = true;
  hov = tileAt(e.clientX, e.clientY);
  if (drag.zoneBox) { p.x = e.clientX; p.y = e.clientY; return; }
  if (drag.paint) { const k = hov[0] + "," + hov[1]; if (k !== lastT) { lastT = k; act(hov[0], hov[1]); } p.x = e.clientX; p.y = e.clientY; return; }
  if (drag.pan) { cam.x += dx; cam.y += dy; p.x = e.clientX; p.y = e.clientY; }
}

function up(e) {
  const p = ptr.get(e.pointerId); if (!p) return;
  if (ptr.size === 1 && drag && drag.zoneBox && zoneDragStart && e.type === "pointerup") {
    const t2 = tileAt(e.clientX, e.clientY);
    const x0 = Math.min(zoneDragStart[0], t2[0]), x1 = Math.max(zoneDragStart[0], t2[0]);
    const y0 = Math.min(zoneDragStart[1], t2[1]), y1 = Math.max(zoneDragStart[1], t2[1]);
    const zObj = curT();
    let cnt = 0;
    for (let xx = x0; xx <= x1; xx++) for (let yy = y0; yy <= y1; yy++) {
      if (!inW(xx, yy) || isW(xx, yy)) continue;
      if (zObj.zt) zones.set(K(xx, yy), zObj.zt); else zones.delete(K(xx, yy));
      cnt++;
    }
    if (cnt > 0) say(zObj.zt ? ("已劃定「" + zObj.n + "」共 " + cnt + " 格") : ("已清除區劃 " + cnt + " 格"));
    zoneDragStart = null;
  } else if (ptr.size === 1 && drag && !drag.moved && !drag.paint && !drag.pan && e.type === "pointerup") { const t = tileAt(e.clientX, e.clientY); act(t[0], t[1]); }
  ptr.delete(e.pointerId); if (ptr.size < 2) pinch = null; if (ptr.size === 0) { drag = null; lastT = ""; }
}

cv.addEventListener("pointerdown", down); cv.addEventListener("pointermove", move); cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const nz = clamp(cam.z * (e.deltaY < 0 ? 1.12 : .89), .55, 2.4);
  cam.x = e.clientX - (e.clientX - cam.x) * (nz / cam.z); cam.y = e.clientY - (e.clientY - cam.y) * (nz / cam.z); cam.z = nz;
}, { passive: false });

function save() {
  const bs = [];
  forEachB(b => bs.push({ x: b.x, y: b.y, t: b.t, c: b.c, p: b.p, prog: b.prog, in: b.in, out: b.out, cash: b.cash, br: b.br || 0, workers: b.workers || [] }));
  const resArr = Array.from(residents.values());
  const hhArr = Array.from(households.values());
  localStorage.setItem("riverside_v8", JSON.stringify({
    m: S.m, day, step, r: [...roads], bg: [...bridges], b: bs,
    res: resArr, hh: hhArr, nrid: nextResId, chr: chronicles.slice(0, 50),
    wx: { sa: seasonAuto, sm: seasonManual, wa: weatherAuto, wi: weatherId, ds: dockSilted, ac: activeChain }, gov: GOV, zn: Array.from(zones.entries()) }));
}

function load() {
  try {
    const raw = localStorage.getItem("riverside_v8") || localStorage.getItem("riverside_v7") || localStorage.getItem("riverside_v6");
    if (!raw) return false;
    const d = JSON.parse(raw);
    S.m = d.m; day = d.day || 0; step = d.step || 0; roads = new Uint8Array(d.r); bridges = new Set(d.bg || []);
    blds = []; bm = new Map();
    d.b.forEach(o => addB(Object.assign({ prog: 0, in: {}, out: {}, cash: 0, st: "", workers: [] }, o)));
    residents = new Map();
    (d.res || []).forEach(r => residents.set(r.id, r));
    households = new Map();
    (d.hh || []).forEach(h => households.set(h.houseKey, h));
    nextResId = d.nrid || (residents.size + 1);
    chronicles = d.chr || [];
    if (d.wx) {
      seasonAuto = d.wx.sa !== undefined ? d.wx.sa : true;
      seasonManual = d.wx.sm || 0;
      weatherAuto = d.wx.wa !== undefined ? d.wx.wa : true;
      weatherId = d.wx.wi || "clear";
      dockSilted = !!d.wx.ds;
      activeChain = d.wx.ac || null;
    }
    if (d.gov) GOV = Object.assign(GOV, d.gov);
    zones = new Map(d.zn || []);
    dirty(); calcConn(); return true;
  } catch (e) { return false; }
}

function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener("resize", resize); resize();
if (!load()) {
  setRoad(DOCK.x, DOCK.y);
  calcConn();
  addChronicle("開基", "在江畔碼頭立下第一根界樁，江畔小鎮正式開埠。", "init");
}
updateWxBar();
const p0 = iso(DOCK.x - 2, DOCK.y); cam.x = innerWidth * .52 - p0[0]; cam.y = innerHeight * .52 - p0[1];
for (let i = 0; i < 4; i++) boats.push({ y: i * 9, v: .45 + i * .08 });
for (let i = 0; i < 65; i++) raindrops.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, v: 260 + Math.random() * 140 });
ui(); tick();

let last = performance.now();
(function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  tAcc += dt; ecoAcc += dt; dayAcc += dt; saveT += dt;
  const spdMult = getCurWeather().spdMult || 1.0;
  for (let i = walkers.length - 1; i >= 0; i--) {
    const m = walkers[i], g = m.path[m.i], dx = g[0] - m.x, dy = g[1] - m.y, d = Math.hypot(dx, dy);
    if (d < .06) { if (++m.i >= m.path.length) walkers.splice(i, 1); }
    else { m.x += dx / d * 2.1 * spdMult * dt; m.y += dy / d * 2.1 * spdMult * dt; }
  }
  for (const b of boats) { b.y += b.v * spdMult * dt; if (b.y > N + 2) b.y = -2; }
  if (weatherId === "rain" || weatherId === "storm") {
    const rSpd = weatherId === "storm" ? 1.55 : 1.0;
    for (const rd of raindrops) {
      rd.x -= 95 * rSpd * dt;
      rd.y += rd.v * rSpd * dt;
      if (rd.y > innerHeight) { rd.y = -12; rd.x = Math.random() * (innerWidth + 120); }
    }
  }
  if (tAcc > .35) { tAcc = 0; ripples.push({ y: Math.random() * N, r: 1, a: .4 }); }
  for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].r += dt * 3; ripples[i].a -= dt * .22; if (ripples[i].a <= 0) ripples.splice(i, 1); }
  if (ecoAcc >= 2.2) { ecoAcc = 0; tick(); }
  if (dayAcc >= 14) { dayAcc = 0; day++; dailyWeatherAndEvents(); bgDay(); collectDailyTax(); }
  if (saveT >= 5) { saveT = 0; save(); }
  draw(); requestAnimationFrame(loop);
})(last);
</script>
</body>
