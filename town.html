  <h2>山河築夢</h2>
  <p>在河岸邊，一格一格把小鎮鋪起來。現在居民有自己的名字、家庭與生活。</p>
  <ol><li>選「鋪路」，從河岸邊的碼頭拖出一條青石路。</li><li>選「民居」，點在路旁的空地，等它落成，居民就會搬進來。</li><li>蓋「麥田→磨坊→麵食店」讓他們有飯吃，其他作坊要有商鋪來收貨。</li><li>點擊路上的居民，可以看他的檔案、家庭與一日作息。</li></ol>
  <p>單指拖曳移動畫面（鋪路和拆除時改用兩指），兩指縮放。右側的 ⌖ 可以隨時回到你的小鎮。進度會自動存在這支手機上。</p>

<script>
(() => {
"use strict";

// ============================================================
// 0. 常數與純函式
// ============================================================
const N = 10000, RX = 5004, HW = 32, HH = 16, DOCK = { x: 5003, y: 5000 }, KEY = "town_save_v5";
const CH = 16;
const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const K = (x, y) => y * N + x;
const inW = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const isW = (x, y) => x >= RX && x < RX + 2;
const P = (x, y, z) => [(x - y) * HW, (x + y) * HH - (z || 0)];
const hs = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;
const hr = () => (S.t / 15) % 24;
const dark = h => (h >= 20 || h < 4) ? 1 : h >= 18 ? (h - 18) / 2 : h < 6 ? (6 - h) / 2 : 0;
const pad = n => String(n).padStart(2, "0");
const SH = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
const GR = { meadow: ["#a6ba72", "#9db46b", "#abbf79"], plain: ["#9db46b", "#96ac64", "#a4b872"], forest: ["#7fa85e", "#76a055", "#88b066"], mountain: ["#8f9a86", "#84907b", "#9aa491"], river: ["#c3bd8e", "#bdb78a", "#c9c394"], water: ["#6fa3bd", "#6a9db6", "#74a9c2"] };
const WC = []; for (let i = 0; i < 8; i++) WC.push("hsl(197 42% " + (47 + i * .9) + "%)");

const VIEW_AI_FULL = 800;
const VIEW_AI_MID = 2000;
const RESERVE_CASH = 20; // 居民基本儲蓄保護線（避免變日光族）

// ============================================================
// 1. 商品與建築資料（提升糧食產線產量，讓小鎮能穩定囤糧）
// ============================================================
const GD = {
  wheat: { n: "小麥", p: 2 }, flour: { n: "麵粉", p: 4 }, noodle: { n: "麵食", p: 6, need: 2.2 },
  pottery: { n: "陶器", p: 10, need: .5 }, wood: { n: "木器", p: 12, need: .5 }, cloth: { n: "布匹", p: 11, need: .45 },
  iron: { n: "鐵器", p: 15, need: .2 }, wine: { n: "酒", p: 13, need: .6 }
};
const CAT = {
  house: [{ id: "h1", n: "民居", c: 80, h: 20, r: 13, w: ["#ece1c8", "#cdc0a1"], f: ["#7a928d", "#566b68", "#8aa39e"] }],
  bridge: [{ id: "b1", n: "大橋", c: 80 }, { id: "b2", n: "小橋", c: 40 }],
  farm: [{ id: "f1", n: "麥田", c: 100, jobs: 2, bt: 12, rec: { in: {}, out: { wheat: 6 } } }],
  shop: [
    { id: "s1", n: "雜貨鋪", c: 120, h: 24, r: 14, w: ["#dbb88f", "#b99671"], f: ["#d1604a", "#a23f2b", "#e07a63"], d: "lan", jobs: 3, sell: ["pottery", "wood", "iron"] },
    { id: "s2", n: "茶坊", c: 140, h: 24, r: 14, w: ["#d9c9a0", "#b8a77d"], f: ["#4f7b6b", "#3a5c50", "#62917f"], d: "flag", jobs: 3, svc: 1 },
    { id: "s3", n: "食肆", c: 160, h: 26, r: 14, w: ["#e4c9a4", "#c2a681"], f: ["#a8553a", "#85402b", "#bd6b4f"], d: "lan", jobs: 3, svc: 1 },
    { id: "s4", n: "布莊", c: 150, h: 24, r: 13, w: ["#e8dcc8", "#c9bb9f"], f: ["#3e5f8a", "#2f4a6c", "#5276a3"], d: "cloth", jobs: 3, sell: ["cloth"] },
    { id: "s5", n: "藥鋪", c: 170, h: 24, r: 14, w: ["#d8cdb3", "#b7ab8f"], f: ["#6a7f4f", "#52643c", "#7f9663"], d: "sign", jobs: 3, svc: 1 },
    { id: "s6", n: "酒樓", c: 260, h: 38, r: 16, w: ["#e2b58c", "#bf9168"], f: ["#b8452e", "#8f3320", "#cf5c43"], d: "lan2", jobs: 4, bt: 30, sell: ["wine"] },
    { id: "s7", n: "麵食店", c: 170, h: 24, r: 14, w: ["#e6d3ae", "#c4b088"], f: ["#b0733a", "#8a5a2c", "#c98a4e"], d: "lan", jobs: 3, sell: ["noodle"], rec: { in: { flour: 4 }, out: { noodle: 12 } } }
  ],
  work: [
    { id: "w1", n: "陶坊", c: 150, h: 22, r: 11, w: ["#bf9f7e", "#9c7f61"], f: ["#8a6650", "#684a38", "#9c7863"], d: "kiln", jobs: 3, rec: { in: {}, out: { pottery: 2 } } },
    { id: "w2", n: "木作坊", c: 150, h: 22, r: 11, w: ["#c9ad82", "#a68b63"], f: ["#6f5a3f", "#54432e", "#836c4e"], d: "logs", jobs: 3, rec: { in: {}, out: { wood: 2 } } },
    { id: "w3", n: "織坊", c: 170, h: 22, r: 12, w: ["#e0d2b6", "#bfb094"], f: ["#8a5f7a", "#6c4960", "#a0768f"], d: "yarn", jobs: 3, rec: { in: {}, out: { cloth: 2 } } },
    { id: "w4", n: "鐵鋪", c: 200, h: 22, r: 11, w: ["#a9a49a", "#878279"], f: ["#5b5f66", "#44474d", "#6e737b"], d: "anvil", jobs: 3, rec: { in: {}, out: { iron: 1 } } },
    { id: "w5", n: "釀酒坊", c: 220, h: 24, r: 12, w: ["#d3b891", "#b09670"], f: ["#7b5b3e", "#5e432d", "#8f6e4f"], d: "jars", jobs: 3, rec: { in: { wheat: 2 }, out: { wine: 2 } } },
    { id: "w6", n: "磨坊", c: 180, h: 26, r: 12, w: ["#cfc2a6", "#aea286"], f: ["#6a6a5a", "#4f4f43", "#80806f"], d: "mill", jobs: 3, rec: { in: { wheat: 4 }, out: { flour: 6 } } }
  ],
  park: [
    { id: "p1", n: "垂柳", c: 60, k: "willow", bt: 6 }, { id: "p2", n: "花圃", c: 50, k: "flower", bt: 6 },
    { id: "p3", n: "池塘", c: 90, k: "pond", bt: 8 }, { id: "p4", n: "涼亭", c: 140, k: "pavilion", bt: 10 },
    { id: "p5", n: "竹林", c: 70, k: "bamboo", bt: 6 }, { id: "p6", n: "假山", c: 110, k: "rock", bt: 8 }
  ]
};
const TY = {}; Object.keys(CAT).forEach(c => CAT[c].forEach(v => { v.cat = c; TY[v.id] = v; }));
const TOOLS = [["look", "探索"], ["road", "鋪路"], ["bridge", "橋樑"], ["house", "民居"], ["farm", "農田"], ["shop", "商鋪"], ["work", "作坊"], ["park", "園景"], ["del", "拆除"]];
const ROAD = 15;

// ============================================================
// 2. 區塊化世界
// ============================================================
const chunks = new Map();
const cKey = (cx, cy) => cx + "," + cy;
const lKey = (x, y) => (((y % CH) + CH) % CH) * CH + (((x % CH) + CH) % CH);
const cOf = (x, y) => [Math.floor(x / CH), Math.floor(y / CH)];
function newChunk(cx, cy) { return { cx, cy, roads: new Set(), bm: new Map(), terrain: null }; }
function getChunk(cx, cy, create) { const k = cKey(cx, cy); let c = chunks.get(k); if (!c && create) { c = newChunk(cx, cy); chunks.set(k, c); } return c; }
function hasRoad(x, y) { if (x < 0 || y < 0 || x >= N || y >= N) return false; const c = getChunk(...cOf(x, y), false); return !!(c && c.roads.has(lKey(x, y))); }
function addRoad(x, y) { if (x < 0 || y < 0 || x >= N || y >= N) return; const c = getChunk(...cOf(x, y), true); c.roads.add(lKey(x, y)); }
function delRoad(x, y) { const c = getChunk(...cOf(x, y), false); if (c) c.roads.delete(lKey(x, y)); }
function getB(x, y) { if (x < 0 || y < 0 || x >= N || y >= N) return null; const c = getChunk(...cOf(x, y), false); return c ? c.bm.get(lKey(x, y)) || null : null; }
function setB(x, y, b) { const c = getChunk(...cOf(x, y), true); c.bm.set(lKey(x, y), b); }
function delB(x, y) { const c = getChunk(...cOf(x, y), false); if (c) c.bm.delete(lKey(x, y)); }
function forEachB(fn) { chunks.forEach(c => c.bm.forEach(b => fn(b, c))); }
function allBuildings() { const a = []; forEachB(b => a.push(b)); return a; }
function countB() { let n = 0; chunks.forEach(c => n += c.bm.size); return n; }
function forEachRoad(fn) { chunks.forEach(c => c.roads.forEach(l => { fn(c.cx * CH + (l % CH), c.cy * CH + Math.floor(l / CH)); })); }

  ecoOpen = false; $("#eco").style.display = "none";
  rosterOpen = false; $("#roster").style.display = "none";
  chronOpen = false; $("#chron").style.display = "none";
  stageOpen = false; $("#stageModal").style.display = "none";
  resCardR = null; $("#resCard").style.display = "none";
  hideCard();
}

function autoAssignJobs() {
  const openBuildings = allBuildings().filter(b => b.p >= 1 && TY[b.t].jobs && ok(b) && (b.workers || []).length < (TY[b.t].jobs || 0));
  if (!openBuildings.length) return say("目前沒有空缺的職位");
  let assigned = 0;
  const day = Math.floor(S.t / 360) + 1;
  residents.forEach(r => {
    if (r.age < 14 || r.jobKey) return;
    const target = openBuildings.find(b => (b.workers || []).length < (TY[b.t].jobs || 0));
    if (target) {
      target.workers = target.workers || [];
      target.workers.push(r.id);
      r.jobKey = K(target.x, target.y);
      r.log.push("第" + day + "日 奉派至" + TY[target.t].n + "工作");
      assigned++;
    }
  });
  if (assigned > 0) {
    say("已為 " + assigned + " 位待業居民安排工作");
    tick();
    renderRoster();
    dirty();
  } else {
    say("沒有可安排工作的待業居民");
  }
}

function renderRoster() {
  const filter = $("#rosterFilter").value;
  const all = Array.from(residents.values());
  const list = all.filter(r => {
    if (filter === "unemployed") return r.age >= 14 && !r.jobKey;
    if (filter === "employed") return !!r.jobKey;
    if (filter === "child") return r.age < 14;
    return true;
  });
  const jobsList = allBuildings().filter(b => b.p >= 1 && TY[b.t].jobs && ok(b));
  const rows = list.map(r => {
    const jb = r.jobKey ? bm.get(r.jobKey) : null;
    const jobName = jb ? TY[jb.t].n : (r.age < 14 ? "幼童" : "待業");
    const opts = ['<option value="">' + (r.age < 14 ? "未滿14歲" : "— 待業 —") + '</option>']
      .concat(jobsList.map(b => {
        const k = K(b.x, b.y);
        const cur = (b.workers || []).length, cap = TY[b.t].jobs || 3;
        const selected = r.jobKey === k ? " selected" : "";
        const disabled = (!selected && cur >= cap) ? " disabled" : "";
        return '<option value="' + k + '"' + selected + disabled + '>' + TY[b.t].n + ' (' + cur + '/' + cap + ')</option>';
      })).join("");
    const jobCell = r.age < 14 ? "幼童" : '<select class="r-job-sel" data-rid="' + r.id + '">' + opts + '</select>';
    return '<tr><td><span class="r-link" data-rid="' + r.id + '">' + r.name + '</span></td><td>' + (r.gender === "f" ? "女" : "男") + '·' + r.age + '歲</td><td>' + jobCell + '</td><td>' + Math.floor(r.wallet || 0) + '文</td><td>' + Math.round(r.mood) + '%</td></tr>';
  }).join("");
  $("#rosterBody").innerHTML = '<p>總人口 <b>' + all.length + '</b> 人（已就業 ' + all.filter(r => r.jobKey).length + ' 人，待業 ' + all.filter(r => r.age >= 14 && !r.jobKey).length + ' 人）</p>' +
    '<table><tr><th>姓名</th><th>性別年齡</th><th>職業指派</th><th>錢包</th><th>心情</th></tr>' + (rows || '<tr><td colspan="5">尚無符合條件的居民</td></tr>') + '</table>';
}

$("#rosterBody").addEventListener("click", e => {
  const el = e.target.closest(".r-link");
  if (!el) return;
  const r = residents.get(Number(el.dataset.rid));
  if (r) {
    closeAllModals();
    centerOn(r.x, r.y);
    clampCam();
    showResident(r);
  }
});

$("#rosterBody").addEventListener("change", e => {
  const selEl = e.target.closest(".r-job-sel");
  if (!selEl) return;
  const r = residents.get(Number(selEl.dataset.rid));
  if (!r) return;
  const newKey = selEl.value ? Number(selEl.value) : null;
  if (r.jobKey != null) {
    const oldB = bm.get(r.jobKey);
    if (oldB && oldB.workers) {
      const idx = oldB.workers.indexOf(r.id);
      if (idx >= 0) oldB.workers.splice(idx, 1);
    }
  }
  r.jobKey = null;
  if (newKey != null) {
    const newB = bm.get(newKey);
    if (newB && (newB.workers || []).length < (TY[newB.t].jobs || 3)) {
      newB.workers = newB.workers || [];
      newB.workers.push(r.id);
      r.jobKey = newKey;
      r.log.push("第" + (Math.floor(S.t / 360) + 1) + "日 調任至" + TY[newB.t].n);
    }
  }
  tick();
  renderRoster();
  dirty();
});

$("#rosterFilter").onchange = renderRoster;
$("#rosterAutoJob").onclick = autoAssignJobs;
$("#bRoster").onclick = () => { closeAllModals(); rosterOpen = true; $("#roster").style.display = "flex"; renderRoster(); };
$("#rosterX").onclick = () => { rosterOpen = false; $("#roster").style.display = "none"; };

function renderChronicle() {
  const st = STAGES[townStage];
  const nextSt = STAGES[townStage + 1];
  const header = '<p>當前規模：<b>' + st.name + '</b>（' + st.desc + '）' +
    (nextSt ? '<br><small>下一階段「' + nextSt.name + '」條件：' + nextSt.desc + '</small>' : '<br><small>已達最高繁華都會規模！</small>') + '</p>';
  const items = chronicle.slice().reverse().map(c =>
    '<div class="chron-item"><span class="chron-tag">' + c.tag + '</span><b>第 ' + c.day + ' 日</b>　' + c.text + '</div>'
  ).join("");
  $("#chronBody").innerHTML = header + (items || "<p>尚無歷史紀錄。</p>");
}

function renderStageModal() {
  const m = getTownMetrics();
  const cur = STAGES[townStage];
  const nxt = STAGES[townStage + 1];

  const rows = STAGES.map((st, idx) =>
    '<tr class="' + (idx === townStage ? "stg-cur" : "") + '"><td>' + (idx === townStage ? "▶ " : "") + st.name + '</td><td>' + st.desc + '</td></tr>'
  ).join("");

  let nextHtml = "";
  if (nxt) {
    const r = nxt.req;
    const checks = [];
    const lacks = [];
    const addCheck = (label, have, need, unit) => {
      if (!need) return;
      const okFlag = have >= need;
      checks.push('<li>' + label + '：<b>' + have + '</b> / ' + need + unit + ' ' + (okFlag ? '<span class="stg-ok">✓</span>' : '<span class="stg-lack">（缺 ' + (need - have) + unit + '）</span>') + '</li>');
      if (!okFlag) lacks.push(label + ' ' + (need - have) + unit);
    };
    addCheck("人數達到", m.pop, r.pop, " 人");
    addCheck("糧食達到", m.food, r.food, " 份");
    addCheck("幸福達到", m.hap, r.hap, "%");
    addCheck("鎮庫達到", m.money, r.money, " 文");
    if (r.farms) addCheck("運作農田", m.farms, r.farms, " 座");
    if (r.shopsOrWorks) addCheck("商鋪或作坊", m.shops + m.works, r.shopsOrWorks, " 座");
    if (r.shops) addCheck("運作商鋪", m.shops, r.shops, " 座");
    if (r.works) addCheck("運作作坊", m.works, r.works, " 座");
    if (r.parks) addCheck("園景設施", m.parks, r.parks, " 座");

    const lackSummary = lacks.length
      ? '<span class="stg-lack">距離晉升「' + nxt.name + '」目前還缺：' + lacks.join("、") + '。</span>'
      : '<span class="stg-ok">所有條件皆已達成，即將晉升為「' + nxt.name + '」！</span>';

    nextHtml = '<div class="stg-box"><div>目前為 <b>' + cur.name + '</b>，要達到下一級「<b>' + nxt.name + '</b>」的需求：</div>' +
      '<ul style="margin:4px 0 6px;padding-left:1.3em">' + checks.join("") + '</ul>' +
      '<div>' + lackSummary + '</div></div>';
  } else {
    nextHtml = '<div class="stg-box">目前為最高規模「<b>' + cur.name + '</b>」，全鎮百業興旺、百姓安居樂業！</div>';
  }

  $("#stageBody").innerHTML =
    '<p style="margin:0 0 6px">全鎮共 <b>4 種規模</b>，分別為：<b>荒野聚落</b>、<b>繁榮村落</b>、<b>商業城鎮</b>、<b>繁華都會</b>。</p>' +
    nextHtml +
    '<table><tr><th>規模等級</th><th>晉升標準</th></tr>' + rows + '</table>';
}

$("#stageBadge").onclick = () => { closeAllModals(); stageOpen = true; $("#stageModal").style.display = "flex"; renderStageModal(); };
$("#stageX").onclick = () => { stageOpen = false; $("#stageModal").style.display = "none"; };

$("#bChron").onclick = () => { closeAllModals(); chronOpen = true; $("#chron").style.display = "flex"; renderChronicle(); };
$("#chronX").onclick = () => { chronOpen = false; $("#chron").style.display = "none"; };

function setObserverMode(on) {
  obsMode = on;
  document.body.classList.toggle("obs", on);
  if (on) {
    closeAllModals();
    obsTarget = null;
    obsTimer = 0;
    say("進入城鎮觀察模式，靜賞河畔日夜煙火");
  }
}
$("#bObs").onclick = () => setObserverMode(true);
$("#obsExit").onclick = () => setObserverMode(false);

$("#bEco").onclick = () => { closeAllModals(); ecoOpen = true; $("#eco").style.display = "flex"; renderEco(); };
$("#ecoX").onclick = () => { ecoOpen = false; $("#eco").style.display = "none"; };

// 12. 啟動

fit(); Z = Math.max(.55, Math.min(1.2, VW / 600)); addEventListener("resize", fit);
let had = load();
if (!had && migrateV4()) { had = true; home(); save(); }
if (!had && migrateV3()) { had = true; home(); save(); }
if (!had && migrateV2()) { had = true; home(); save(); }
if (!had) fresh();
genChunk(...cOf(DOCK.x, DOCK.y));
calcConn();
if (CR.length) {
  residents.forEach(r => {
    if (r.houseKey == null || !bm.get(r.houseKey)) {
      const k = CR[Math.random() * CR.length | 0];
      r.x = (k % N) + .3 + Math.random() * .4;
      r.y = ((k / N) | 0) + .3 + Math.random() * .4;
    }
  });
}
evalTownStage(); updateActiveSet(); clampCam(); renderSub(); updBar();
if (!had) introOpen = true; else $("#intro").style.display = "none";
$("#go").onclick = () => { introOpen = false; $("#intro").style.display = "none"; save(); };
let last = 0;
function loop(ts) {
  const dt = Math.min(.1, (ts - last) / 1000 || 0); last = ts;
  if (!paused && !introOpen) step(dt * speed);
  draw(ts); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setInterval(hud, 250); setInterval(save, 5000);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); }); addEventListener("pagehide", save);
})();
